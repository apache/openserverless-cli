version: "3"

vars:
  REPO: "https://github.com/apache/openserverless-task"
  BRANCH: "0.9.0"
  VARIANT: "incubating"
  SUFFIX: "-snapshot"
  VERSION:
    sh: git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD
  DEBUG: ""

tasks:

  default: task -l
  setup: { silent:true }

  tag:
    desc: tag the cli to generate the build
    vars:
      TS:
        sh: date '+%y %m %d %H %M' | awk '{printf "%s%s%02d%s%02d\n", $1, substr("abcdefghijkl",$2+0,1), $3, substr("abcdefghijklmnopqrstuvwx",$4+1,1), $5}'
      VERSION:
        sh: echo "{{.BRANCH}}-{{.VARIANT}}+{{.TS}}{{.SUFFIX}}"
    cmds:
    - cp -v HEADER version.txt
    - cp -v HEADER branch.txt
    - cp -v HEADER repo.txt
    - echo {{.VERSION}} >>version.txt
    - echo "{{.BRANCH}}" >>branch.txt
    - |
      if test -n "$CUSTOM_OPS_REPO"
      then echo "$CUSTOM_OPS_REPO" >repo.txt
      else echo {{.REPO}} >>repo.txt
      fi
    - git tag | xargs git tag -d
    - git add version.txt branch.txt repo.txt
    - git commit -m {{.VERSION}} || true
    - git tag -f "v{{.VERSION}}"

  ci:
    desc: create tag and push triggering a build
    cmds:
    - git push origin --tags

  rebuild:
    - rm -f ops
    - task: build

  add-header:
  - |
    find . -name \*.licensed | while read FILE
    do
      echo "adding header to $FILE"
      cat HEADER ${FILE%.licensed} >$FILE
    done

  strip-header:
    vars:
      START:
        sh: wc -l HEADER | awk '{print $1 + 1}'
    cmds:
    - |
      find . -name \*.licensed | while read FILE
      do
        tail -n +{{.START}} $FILE >${FILE%.licensed}
      done

  build:
    aliases: [b]
    desc: build ops locally
    cmds:
      - echo building {{.VERSION}}
      - go build  {{.DEBUG}} ./cmd/ops/
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - version.txt
      - branch.txt
    generates:
      - ops

  debug:
    aliases: [d]
    cmds:
      - task: build
        vars:
          DEBUG: "-gcflags '-l -N'"
      - dlv exec ./ops -- {{.CLI_ARGS}}

  install:
    aliases: [i]
    desc: install ops in ~./local/bin
    deps:
      - build
    cmds:
      - mkdir -p $HOME/.local/bin
      - cp -v ops $HOME/.local/bin
      - |
        if ! which ops | grep $HOME/.local/bin
        then
          echo "$HOME/.local/bin is not in the path - adding it"
          echo 'export PATH="$HOME/.local/bin:$PATH"' >>$HOME/.bashrc
          echo 'export PATH="$HOME/.local/bin:$PATH"' >>$HOME/.zshrc
          echo to find ops in the path, please either source your .bashrc or .zshrc or restart your terminal
        else
          echo installed ops v$(ops -version)
        fi


  tests:
    desc: all tests
    cmds:
      - touch tools/empty_file
      - task: install
      - task: utest
      - task: itest

  utest:
    aliases: [ut]
    desc: unit test (use F=-v to verbose)
    cmds:
      - rm -Rf ~/.ops
      - go clean -testcache -cache
      - go test -count=1 {{.F}} ./...


  bats:
    dir: tests
    vars:
      BATS_CORE_VERSION: v1.13.0
      BATS_SUPPORT_VERSION: v0.3.0
      BATS_ASSERT_VERSION: v2.2.4
    cmds:
    - rm -Rf bats test_helper/bats-support test_helper/bats-assert
    - git clone --branch {{.BATS_CORE_VERSION}} --depth 1 https://github.com/bats-core/bats-core bats
    - git clone --branch {{.BATS_SUPPORT_VERSION}} --depth 1 https://github.com/bats-core/bats-support test_helper/bats-support
    - git clone --branch {{.BATS_ASSERT_VERSION}} --depth 1 https://github.com/bats-core/bats-assert test_helper/bats-assert
    status:
    - test "$(git -C bats describe --tags --exact-match 2>/dev/null)" = "{{.BATS_CORE_VERSION}}"
    - test "$(git -C test_helper/bats-support describe --tags --exact-match 2>/dev/null)" = "{{.BATS_SUPPORT_VERSION}}"
    - test "$(git -C test_helper/bats-assert describe --tags --exact-match 2>/dev/null)" = "{{.BATS_ASSERT_VERSION}}"

  itest:
    aliases: [it]
    desc: integration tests for ops (T=<test-name> without .bats, empty run all, pass flags with F=)
    dir: tests
    cmds:
      - task: bats
      - task: strip-header
      #- rm -Rf ~/.ops/oplugins ~/.ops/olaris
      - ops -reset force
      - ops -t
      - |
        unset DEBUG
        unset TRACE
        unset OPS_BRANCH
        unset OPS_REPO
        unset OPS_ROOT
        if test -z "{{.T}}"
        then bats/bin/bats {{.F}} .
        else bats/bin/bats {{.F}} {{.T}}.bats
        fi

  rat:
    desc: check ASF license compliance with Apache RAT
    cmds:
    - rat --input-exclude-parsed-scm GIT --input-exclude-file .rat-excludes -- .

  rat-list:
    desc: list files RAT does not approve, one per line (T=all to list every file)
    vars:
      XML: .task/rat.xml
    cmds:
    - mkdir -p .task
    - defer: rm -f {{.XML}}
    - rat --input-exclude-parsed-scm GIT --input-exclude-file .rat-excludes --output-file {{.XML}} --output-style xml -- . >/dev/null 2>&1 || true
    - |
      python3 - {{.XML}} {{.T}} <<'EOF'
      import sys, xml.etree.ElementTree as ET
      xml = sys.argv[1]
      show_all = len(sys.argv) > 2 and sys.argv[2] == 'all'
      for res in ET.parse(xml).getroot().iter('resource'):
          approved = any(l.get('approval') == 'true' for l in res.findall('license'))
          if approved and not show_all:
              continue
          lic = ','.join(l.get('id') or '?' for l in res.findall('license')) or '-'
          print(f"{res.get('type'):9} {res.get('mediaType'):26} {lic:12} {res.get('name')}")
      EOF

  clean:
    - rm ops || true
    - go clean -cache -modcache -testcache -fuzzcache

  utestdiff:
    cmds:
      - |-
        if test -z '{{.N}}'
        then  go test -v | tee _difftest
              python3 difftest.py
        else  python3 difftest.py {{.N}}
        fi
